name: Publication quotidienne des articles

# Cron de secours fiable, en remplacement du cron Vercel Hobby
# (peu fiable : timing randomisé, runs parfois skippés).
#
# Hit /api/cron/publish chaque jour à 07:05 UTC (5 min après que le cron
# Vercel aurait dû tirer, pour ne pas se marcher dessus si les deux
# fonctionnent). Auth par Bearer token : la variable d'env CRON_SECRET
# doit être identique côté Vercel et côté GitHub Actions secrets.

on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit cron endpoint
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET secret n'est pas défini sur le repo GitHub"
            exit 1
          fi
          response=$(curl -sS -w "\n%{http_code}" \
            -H "Authorization: Bearer $CRON_SECRET" \
            "https://www.escalade-france.fr/api/cron/publish")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Cron endpoint a renvoyé $code"
            exit 1
          fi
