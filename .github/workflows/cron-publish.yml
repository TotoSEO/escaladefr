name: Publication quotidienne des articles

# Le cron Vercel Hobby est peu fiable (randomisé, parfois skippé).
# Ce workflow prend le relais chaque jour à 07:05 UTC.
# Auth via User-Agent vercel-cron (accepté par la route) — aucun
# secret à configurer ni côté GitHub ni côté Vercel.

on:
  schedule:
    - cron: "5 7 * * *"
  workflow_dispatch: {}

concurrency:
  group: cron-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Hit cron endpoint
        run: |
          response=$(curl -sS -w "\n%{http_code}" \
            -A "vercel-cron/1.0" \
            "https://www.escalade-france.fr/api/cron/publish")
          body=$(echo "$response" | head -n -1)
          code=$(echo "$response" | tail -n 1)
          echo "HTTP $code"
          echo "$body"
          if [ "$code" != "200" ]; then
            echo "::error::Cron endpoint returned $code"
            exit 1
          fi
